# Render Blueprint. SQLite needs a persistent disk, and disks require a paid instance type.
services:
  - type: web
    name: obs-scene-builder
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        generateValue: true
    disk:
      name: scene-data
      mountPath: /var/data
      sizeGB: 1
